name: crypto-radar

on:
  # 定时调度已迁到 VPS(systemd 常驻循环); 这里只保留手动触发做应急/验证
  workflow_dispatch: {}

permissions:
  contents: write  # 允许运行结束把 signals.json 变化提交回仓库

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run radar
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # 手动触发时跑 3 轮, 每轮后 sleep 20 分钟; 单轮异常不中断后续轮次
        run: |
          for i in 1 2 3; do
            echo "=== 第 $i 轮巡检 $(date -u '+%Y-%m-%d %H:%M:%SZ') ==="
            uv run --no-sync crypto_radar.py || echo "第 $i 轮巡检失败, 继续下一轮"
            if [ "$i" -lt 3 ]; then sleep 1200; fi
          done

      # 手动触发时把状态提交回 main, 供下次运行读取; 放循环外统一提交一次。
      # push 被拒时 rebase 远端后重试; 状态文件由本 job 独占写入。
      - name: Commit signal data
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/signals.json
          if [ -f data/universe.json ]; then git add data/universe.json; fi
          if [ -f data/signals_archive.json ]; then git add data/signals_archive.json; fi
          git diff --cached --quiet || git commit -m "data: update radar state [skip ci]"
          git pull --rebase origin main
          git push
