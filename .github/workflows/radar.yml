name: crypto-radar

on:
  schedule:
    - cron: '5,25,45 * * * *'  # 每小时三次, 错开整点排队高峰
  workflow_dispatch: {}  # 允许手动触发测试

permissions:
  contents: write  # 允许运行结束把 signals.json 变化提交回仓库

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Run radar
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run crypto_radar.py

      # 仓库即数据库: 把信号档案变化提交回 main, 供下次运行读取
      - name: Commit signal data
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/signals.json
          git diff --cached --quiet || git commit -m "data: update signal tracking [skip ci]"
          git push
